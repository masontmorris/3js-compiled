[package]
name = "xproc-game"
version = "0.1.0"
edition = "2024"
publish = false
license = "MPL-2.0"

# Own workspace root: resolved independently of ui-host (no Servo/SpiderMonkey in this graph).
[workspace]

[dependencies]
deno_core = "0.413.0"
pollster = "0.4.0"
tokio = { version = "1", features = ["rt"] }
wgpu = "30.0.1"
wgpu-hal = { version = "30.0.1", features = ["dx12"] }
winit = "0.30.13"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Dxgi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Pipes",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_System_IO",
] }

[profile.release]
debug = 0
