name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  rust:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - run: cargo fmt --all --check
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      # The host's tests bundle the example scenes with esbuild and the patched three.js.
      - run: npm ci
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy --locked --workspace -- -D warnings
      # These two assert thread wake-ups within a fraction of a millisecond, which a shared runner
      # cannot promise. docs/testing.md lists what CI leaves out.
      - run: >-
          cargo test --locked --workspace --
          --skip game::tests::the_game_thread_wakes_as_the_render_thread_finishes
          --skip game::tests::with_vsync_off_a_frame_runs_while_the_render_thread_draws_the_one_before

  js:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - id: naga
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/naga.exe
          key: naga-cli-30.0.1-${{ runner.os }}
      - if: steps.naga.outputs.cache-hit != 'true'
        working-directory: ${{ runner.temp }}
        run: cargo install naga-cli --version 30.0.1 --locked
      - name: Use the Windows SDK's dxc
        shell: pwsh
        run: |
          $dxc = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\10.*\x64\dxc.exe" | Sort-Object FullName | Select-Object -Last 1
          if (-not $dxc) { throw "no dxc.exe in the Windows SDK" }
          "DXC=$($dxc.FullName)" >> $env:GITHUB_ENV
      - run: npm run check
