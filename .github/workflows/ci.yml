name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  rust:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - run: cargo fmt --all --check
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # The host's tests bundle the example scenes with esbuild and the patched three.js.
      - run: npm ci
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --locked --workspace -- -D warnings
      - run: cargo test --locked --workspace

  js:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - id: naga
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/naga.exe
          key: naga-cli-30.0.1-${{ runner.os }}
      - if: steps.naga.outputs.cache-hit != 'true'
        working-directory: ${{ runner.temp }}
        run: cargo install naga-cli --version 30.0.1 --locked
      - name: Use the Windows SDK's dxc
        shell: pwsh
        run: |
          $dxc = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\10.*\x64\dxc.exe" | Sort-Object FullName | Select-Object -Last 1
          if (-not $dxc) { throw "no dxc.exe in the Windows SDK" }
          "DXC=$($dxc.FullName)" >> $env:GITHUB_ENV
      - run: npm run check
