[package]
name = "threejsc-host"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[[bin]]
name = "host"
path = "src/main.rs"

[dependencies]
threejsc-gpu = { path = "../gpu" }
threejsc-audio = { path = "../audio", features = ["output"] }
futures-channel = "0.3"
futures-util = "0.3"
anyhow = "1"
deno_core = "0.413.0"
deno_error = "=0.7.1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
moxcms = "0.8"
getrandom = "0.4"
pollster = "0.4"
sdl3 = { version = "0.22.1", features = ["build-from-source-static", "raw-window-handle"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt"] }
wgpu = { version = "30.0.1", features = ["static-dxc"] }
