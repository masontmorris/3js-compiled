[package]
name = "threejsc-host"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[[bin]]
name = "host"
path = "src/main.rs"

[dependencies]
anyhow = "1"
deno_core = "0.413.0"
image = { version = "0.25", default-features = false, features = ["png"] }
pollster = "0.4"
sdl3 = { version = "0.22.1", features = ["build-from-source-static", "raw-window-handle"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt"] }
wgpu = { version = "30.0.1", features = ["static-dxc"] }

threejsc-ipc = { path = "../ipc" }
wgpu-hal = { version = "30.0.1", features = ["dx12"] }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Direct3D12", "Win32_Graphics_Dxgi", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Pipes", "Win32_System_Threading", "Win32_System_IO"] }
